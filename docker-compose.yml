services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm}
      MYSQL_USER: ${MYSQL_USER:-crm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crm}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TINYMCE_API_KEY: ${NEXT_PUBLIC_TINYMCE_API_KEY:-}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-crm}:${MYSQL_PASSWORD:-crm}@mysql:3306/${MYSQL_DATABASE:-crm}"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-string-please-32+}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-crm_session}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-CRM}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      UPLOADS_DIR: /data/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@crm.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      POSTMARK_MESSAGE_STREAM: ${POSTMARK_MESSAGE_STREAM:-outbound}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${WEB_PORT:-3000}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - uploads_data:/data/uploads

volumes:
  mysql_data:
  uploads_data:
